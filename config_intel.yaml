server:
  host: "0.0.0.0"
  port: 8000
  # IPv4 (0.0.0.0) uses ai.sunflv.top cert; IPv6 (::) uses 6.sunflv.top cert
  # Both on port 8000 — separate sockets per address family
  listeners:
    - host: "0.0.0.0"
      port: 8000
      ssl_cert: "D:/BSAIReader/server/ai.sunflv.top.crt"
      ssl_key:  "D:/BSAIReader/server/ai.sunflv.top.key"
    - host: "::"
      port: 8000
      ssl_cert: "D:/BSAIReader/server/6.sunflv.top.crt"
      ssl_key:  "D:/BSAIReader/server/6.sunflv.top.key"

backend: "http://127.0.0.1:9880"
backend_base_port: 9880
pool_size: 2
intel_root: "D:\\BSAIReader\\GPT-SoVITS-For-Intel"
# ── 后端池 ──────────────────────────────────────────────────────
# 所有音色统一走 v5Turbo 底模，不再按版本切模型。实例数量由下面的
# parallel_infer 开关决定：开启=每模型 1 实例（实例内并行），
# 关闭=每模型 ports_per_model 个实例（多实例并发）。
# 显存预算：单份模型约 2.2 GiB（A770 15.56 GiB）；若关闭并行开 4 实例，
# 加推理激活约 12-13 GiB，余量有限 —— 请勿再增加并发数。
# 冷启动按需触发（首个请求才加载），加载过程全局串行以避免瞬时显存峰值。
# 关键：单个 api_v2 进程加载模型后约占 7 GB RAM / 8.3 GB 私有内存（实测），
# 机器总内存仅 15.86 GB，因此空闲后必须卸载释放，否则会持续挤占内存直至 OOM。
# pool_idle_ttl: 后端空闲超过该秒数即停止进程、释放模型；0=从不卸载（会 OOM，勿用）。
pool_idle_ttl: 300       # 5 分钟空闲即卸载；下次请求冷加载（约 20-90 s）
pool_evict_grace: 0      # 兼容旧配置；单模型池不再驱逐对等端口

tts:
  device: "xpu"
  is_half: true  # fp16 在 XPU 上偶发静音，改 fp32 提高稳定性
  version: v5turbo
  t2s_weights_path: "GPT_SoVITS/pretrained_models/s1v3.ckpt"
  vits_weights_path: "GPT_SoVITS/pretrained_models/gsv-v5-pretrained/s2Gv5turbo.pth"
  bert_base_path: "GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large"
  cnhuhbert_base_path: "GPT_SoVITS/pretrained_models/chinese-hubert-base"

voices:
  - name: "v4_default"
    description: "高松灯-叙述 (中文输入)"
    text_lang: "zh"
    prompt_lang: "ja"
    ref_audio_path: "D:/BSAIReader/server/voices/default_ref.mp3"
    prompt_text: "そよちゃん、部活でコントラバス、だっけ"

  - name: "v4_tomori"
    description: "高松灯-开心"
    text_lang: "zh"
    prompt_lang: "ja"
    ref_audio_path: "D:/BSAIReader/server/voices/tomori/ref.wav"
    prompt_text: "ありがとう、立希ちゃん"

  - name: "v4_anon"
    description: "千早爱音-兴奋"
    text_lang: "zh"
    prompt_lang: "ja"
    ref_audio_path: "D:/BSAIReader/server/voices/anon/ref.wav"
    prompt_text: "なんて思ったり、よーしライブ成功!みんなで写真撮ってSNSにアップしちゃおう!"

  - name: "v4_taki"
    description: "椎名立希-军训"
    text_lang: "zh"
    prompt_lang: "ja"
    ref_audio_path: "D:/BSAIReader/server/voices/taki/ref.wav"
    prompt_text: "あのお前も全然ダメ人の倍練習して"

  - name: "v4_rana"
    description: "要乐奈-叙述"
    text_lang: "zh"
    prompt_lang: "ja"
    ref_audio_path: "D:/BSAIReader/server/voices/rana/ref.mp3"
    prompt_text: "楽しかった。お腹すいた。お蕎麦食べたい。"

  - name: "v4_soyo"
    description: "长崎素世-叙述"
    text_lang: "zh"
    prompt_lang: "ja"
    ref_audio_path: "D:/BSAIReader/server/voices/soyo/ref.wav"
    prompt_text: "ありがと。見てないんじゃない私に言われても。"

  - name: "v4_sunflv"
    description: "SunFLV本人音色 (最新训练)"
    text_lang: "zh"
    prompt_lang: "zh"
    ref_audio_path: "D:/BSAIReader/server/voices/sunflv/ref.wav"
    prompt_text: "火海般的恨意让他立于巅峰，却被一滴和50年前同样蓝、同样清澈的水滴浇灭。"

# ── 并行推理开关 ────────────────────────────────────────────────
# parallel_infer = 是否启用（实例内）并行推理，决定实例池策略：
#   true  -> 强制单实例：无论请求什么版本，都只用默认模型的 1 个实例，
#             靠实例内 batch_infer 并行。模型不同也不会启动第二个实例
#             （多实例会因显存不足 OOM）。显存只占约 2.2 GiB，
#             长文本实测比串行快约 16%（48s→41s）。
#             batch 大小由 parallel_batch_size 控制（默认 4）。
#   false -> 保持原状：相同模型也启动多个实例并发，实例数由 ports_per_model
#             决定（4 个 → 9880-9883），实例内改用串行推理。
# 无论哪种模式，并行返回静音时服务端都会自动回退到串行重试。
parallel_infer: true
parallel_batch_size: 4   # 仅 parallel_infer=true 时生效

# 推理配置：所有音色统一使用 v5Turbo。前端即使传旧版本名（如 v4）也会被
# 归一化到这个唯一 profile —— 服务端不再加载任何 v4 模型。
# ports_per_model 仅在 parallel_infer=false 时生效。
default_model: "v5turbo"
ports_per_model: 4
models:
  v5turbo:
    version: v5turbo
    label: "v5Turbo / 4 步"
    t2s_weights_path: "GPT_SoVITS/pretrained_models/s1v3.ckpt"
    vits_weights_path: "GPT_SoVITS/pretrained_models/gsv-v5-pretrained/s2Gv5turbo.pth"
    sample_steps: 4
    is_half: true
