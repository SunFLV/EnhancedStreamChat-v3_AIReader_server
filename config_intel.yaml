server:
  host: "0.0.0.0"
  port: 8000
  # IPv4 (0.0.0.0) uses ai.sunflv.top cert; IPv6 (::) uses 6.sunflv.top cert
  # Both on port 8000 — separate sockets per address family
  listeners:
    - host: "0.0.0.0"
      port: 8000
      ssl_cert: "route/to/your/domain.crt"
      ssl_key:  "route/to/your/domain.key"
    - host: "::"
      port: 8000
      ssl_cert: "route/to/your/domain.crt"
      ssl_key:  "route/to/your/domain.key"

backend: "http://127.0.0.1:9880"
backend_base_port: 9880
pool_size: 2
ports_per_model: 2
intel_root: "route/to/your/GPT-SoVITS-Instance"

tts:
  device: "auto"
  is_half: true
  version: v5turbo
  t2s_weights_path: "GPT_SoVITS/pretrained_models/s1v3.ckpt"
  vits_weights_path: "GPT_SoVITS/pretrained_models/gsv-v5-pretrained/s2Gv5turbo.pth"
  bert_base_path: "GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large"
  cnhuhbert_base_path: "GPT_SoVITS/pretrained_models/chinese-hubert-base"

# 推理版本 profile：前端传 version，服务端按 profile 启动对应后端。
# 每个 profile 会生成一份独立的 tts_infer 配置给 api_v2.py -c 使用。
default_model: "v5turbo"
models:
  v4:
    version: v4
    label: "v4 / 32 步"
    t2s_weights_path: "GPT_SoVITS/pretrained_models/s1v3.ckpt"
    vits_weights_path: "GPT_SoVITS/pretrained_models/gsv-v4-pretrained/s2Gv4.pth"
    sample_steps: 32
    is_half: true
  v5turbo:
    version: v5turbo
    label: "v5Turbo / 8 步"
    t2s_weights_path: "GPT_SoVITS/pretrained_models/s1v3.ckpt"
    vits_weights_path: "GPT_SoVITS/pretrained_models/gsv-v5-pretrained/s2Gv5turbo.pth"
    sample_steps: 8
    is_half: true

voices:
  - name: "default"
    description: "defult"
    text_lang: "zh"
    prompt_lang: "zh"
    ref_audio_path: "route/to/your/ref.wav/or/mp3"
    prompt_text: "xxx"
